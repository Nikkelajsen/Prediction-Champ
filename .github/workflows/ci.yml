name: CI

# Kører linter, tests og produktions-build ved hver pull request og ved push til
# main. Indtil nu var skema-eksporten repoets eneste workflow, og den validerer
# ikke kode — så merge-sikkerheden hvilede på, at et menneske huskede at køre
# `npm test` plus den manuelle tjekliste i DOCUMENTATION.md afsnit 11.
#
# Tjeklisten er stadig gyldig: den dækker det, testene IKKE kan se (rigtig
# browser, push på iOS, RLS mod produktionsdata). Denne workflow afløser den
# ikke — den fjerner bare de fejl, en maskine kan fange, fra menneskets bord.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Ved gen-push aflyses den forrige kørsel — det er kun det nyeste commit,
  # der er interessant. (Skema-eksporten gør bevidst det modsatte: den skriver
  # til repoet og må derfor ikke afbrydes midtvejs.)
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Opsæt Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` frem for `npm install`: den installerer præcis det, der står i
      # package-lock.json, og fejler hvis lock-filen er ude af trit med
      # package.json — så CI tester det samme træ, som ligger i repoet.
      - name: Installér afhængigheder
        run: npm ci

      # Linteren er det eneste statiske sikkerhedsnet i en utypet kodebase.
      # --max-warnings er sat til det nuværende antal i package.json, så tallet
      # kan falde, men aldrig vokse ubemærket.
      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Build'et fanger det, testene ikke ser: manglende eksporter, brudte
      # importstier og alt andet, der først viser sig, når hele grafen samles.
      - name: Build
        run: npm run build

  # Ratingberegningen er ren SQL og kan ikke nås fra Vitest. Den var indtil 30.
  # juli 2026 det eneste store domæne helt uden test — og optimeringen samme dag
  # ændrede logistikken fra numeric til double precision. Dette job er beviset
  # for, at resultatet ikke flyttede sig: sql/tests/rating_equivalence.sql kører
  # både den nuværende og den frosne før-optimering-reference og sammenligner.
  #
  # Egen database i en service-container — testen rører aldrig produktion, og
  # den behøver ingen secrets.
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ækvivalenstest for ratingberegningen
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database ratingtest;'
          # `-b` gør, at fejl fra \ir-inkluderede filer også stopper kørslen.
          psql -h localhost -U postgres -d ratingtest -v ON_ERROR_STOP=1 -b -f rating_equivalence.sql

      # Lokale kåringer (A22): kører selve migreringen competition_awards.sql
      # og efterprøver kåringsreglerne — færdig runde/måned, delt sejr, guard,
      # idempotens, service_role. Egen database, så de to tests ikke kan
      # forurene hinandens skema.
      - name: Test af lokale kåringer
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database awardstest;'
          psql -h localhost -U postgres -d awardstest -v ON_ERROR_STOP=1 -b -f competition_awards.sql

      # Fejltelemetri (G42): tabellen client_errors + den admin-gatede RPC.
      # Kontrollerer BEGGE retninger — at en bruger kan skrive sin egen fejl og
      # ikke andres, og at ingen kan læse tabellen uden om RPC'en.
      - name: Test af fejltelemetrien
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database cetest;'
          psql -h localhost -U postgres -d cetest -v ON_ERROR_STOP=1 -b -f client_errors.sql

      # predictions.updated_at-triggeren (G13). En manglende trigger er usynlig
      # — feltet har en default, så en frisk række ser rigtig ud, og fejlen
      # viser sig først som et Analytics-tal, der er lidt for lavt.
      - name: Test af updated_at-triggeren
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database putest;'
          psql -h localhost -U postgres -d putest -v ON_ERROR_STOP=1 -b -f predictions_updated_at.sql

      # anon-grants (G50): kører migreringen og efterprøver BEGGE halvdele —
      # at anon mister tabel-adgangen, og at kilden (Supabases default
      # privileges for public) er lukket, så en tabel oprettet bagefter heller
      # ikke får den. Den anden halvdel er den, der betyder noget på sigt:
      # bredden var en regel og ikke en liste.
      - name: Test af anon-grants
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database anongrants;'
          psql -h localhost -U postgres -d anongrants -v ON_ERROR_STOP=1 -b -f anon_grants.sql

      # Story Engine v1.2's kåringsregler (B10): kører rating_core +
      # competition_awards + story_engine i én tom database og efterprøver
      # kæden fra kåringsrække til historie-kort. Egen database, som de andre.
      #
      # Kæden går gennem tre filer og to skrivetidspunkter, og fejler den,
      # fejler den TAVST: matches-triggeren er exception-guarded, så et
      # manglende kort ikke kan skelnes fra en stille uge.
      - name: Test af Story Engines kåringsregler
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database storytest;'
          psql -h localhost -U postgres -d storytest -v ON_ERROR_STOP=1 -b -f story_engine_awards.sql

      # Story Engine v2's DAGLIGE historier. Den vigtigste påstand i filen er
      # ikke, at reglerne virker, men at runde-motoren IKKE sletter dagskort:
      # de to motorer deler tabel og round_key, og v1's uafgrænsede delete ville
      # tørre hele ugen væk ved hver resultatændring.
      #
      # Filen påstår desuden et IKKE-NUL rækkeantal. Det er ikke pedanteri: hele
      # kæden ligger bag matches-triggerens exception-guard, og den mest
      # sandsynlige fejl (en date/text-sammenligning) fejler TAVST — uden den
      # påstand ville en motor, der intet producerer, være grøn.
      - name: Test af Story Engines daglige historier
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database dailytest;'
          psql -h localhost -U postgres -d dailytest -v ON_ERROR_STOP=1 -b -f story_engine_daily.sql

      # Milepæle: permanente engangs-bedrifter. Testen vogter især de guards,
      # der gør en milepæl noget værd — feltstørrelse ("top 3 af 3" må ikke
      # uddeles), peak frem for nuværende rating, og at en konkurrence, der
      # stadig kan vokse, ikke meldes færdig. En uddelt milepæl kan ikke tages
      # tilbage, så fejlen er ikke til at rette bagefter.
      - name: Test af milepæle
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database mstest;'
          psql -h localhost -U postgres -d mstest -v ON_ERROR_STOP=1 -b -f milestones.sql

      # Sikkerhedsstramningen (G14/G15/G16): kører selve migreringen
      # security_hardening.sql og efterprøver BEGGE retninger — at anon og en
      # almindelig bruger er lukket ude af matches, recompute_ratings() og
      # monthly_standings, OG at admin, rating-triggeren og service_role stadig
      # kommer igennem. Egen database, som de to andre.
      - name: Test af sikkerhedsstramningen
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database sectest;'
          psql -h localhost -U postgres -d sectest -v ON_ERROR_STOP=1 -b -f security_hardening.sql

      # Feedback (B14): kører migreringen feedback.sql og efterprøver, at RLS
      # kun tillader insert af egne rækker, at INGEN bruger kan læse tabellen,
      # og at begge admin-RPC'er svarer 'forbidden' til en ikke-admin.
      - name: Test af feedback
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database fbtest;'
          psql -h localhost -U postgres -d fbtest -v ON_ERROR_STOP=1 -b -f feedback.sql

      # Unique-constraints på leverandør-id'erne (G7): efterprøver især, at de
      # tre LOVLIGE gentagelser stadig er lovlige — samme klub i to turneringer,
      # samme sæson-id i flere turneringer, samme liga-id hos to leverandører.
      # En for stram constraint her gør Champions League usynkroniserbar.
      #
      # Kørslen støjer med to FORVENTEDE fejl til sidst (vagten mod dubletter,
      # der findes i forvejen — se filens punkt 4). Den slår selv ON_ERROR_STOP
      # fra og til igen omkring dem, så et grønt trin betyder stadig, at alle
      # påstande holdt.
      - name: Test af unique-constraints på leverandør-id'er
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database idtest;'
          psql -h localhost -U postgres -d idtest -v ON_ERROR_STOP=1 -b -f api_id_uniqueness.sql

      # Kontolukning ved anonymisering (B4): efterprøver især den påstand, hele
      # valget hviler på — at brugerens tips, rating, kåringer OG den liga,
      # de oprettede, står uændret bagefter. En rigtig sletning ville have
      # kaskaderet ligaen væk og taget de andre medlemmer med.
      - name: Test af kontolukning
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database anontest;'
          psql -h localhost -U postgres -d anontest -v ON_ERROR_STOP=1 -b -f account_anonymization.sql
