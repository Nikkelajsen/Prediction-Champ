name: CI

# Kører linter, tests og produktions-build ved hver pull request og ved push til
# main. Indtil nu var skema-eksporten repoets eneste workflow, og den validerer
# ikke kode — så merge-sikkerheden hvilede på, at et menneske huskede at køre
# `npm test` plus den manuelle tjekliste i DOCUMENTATION.md afsnit 11.
#
# Tjeklisten er stadig gyldig: den dækker det, testene IKKE kan se (rigtig
# browser, push på iOS, RLS mod produktionsdata). Denne workflow afløser den
# ikke — den fjerner bare de fejl, en maskine kan fange, fra menneskets bord.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Ved gen-push aflyses den forrige kørsel — det er kun det nyeste commit,
  # der er interessant. (Skema-eksporten gør bevidst det modsatte: den skriver
  # til repoet og må derfor ikke afbrydes midtvejs.)
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Opsæt Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` frem for `npm install`: den installerer præcis det, der står i
      # package-lock.json, og fejler hvis lock-filen er ude af trit med
      # package.json — så CI tester det samme træ, som ligger i repoet.
      - name: Installér afhængigheder
        run: npm ci

      # Linteren er det eneste statiske sikkerhedsnet i en utypet kodebase.
      # --max-warnings er sat til det nuværende antal i package.json, så tallet
      # kan falde, men aldrig vokse ubemærket.
      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Build'et fanger det, testene ikke ser: manglende eksporter, brudte
      # importstier og alt andet, der først viser sig, når hele grafen samles.
      - name: Build
        run: npm run build

  # Ratingberegningen er ren SQL og kan ikke nås fra Vitest. Den var indtil 30.
  # juli 2026 det eneste store domæne helt uden test — og optimeringen samme dag
  # ændrede logistikken fra numeric til double precision. Dette job er beviset
  # for, at resultatet ikke flyttede sig: sql/tests/rating_equivalence.sql kører
  # både den nuværende og den frosne før-optimering-reference og sammenligner.
  #
  # Egen database i en service-container — testen rører aldrig produktion, og
  # den behøver ingen secrets.
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Produktionsskemaet bygges ÉN gang og bruges af alle de trin nedenfor,
      # der ikke kan nøjes med et miniskema. Det lå indtil `G91` inde i
      # rating-friskhedens trin, altså midt i jobbet — og da `G91` flyttede to
      # tests mere over på det rigtige skema, blev den placering en usynlig
      # rækkefølgeafhængighed: et trin, der læser filen, skulle stå EFTER et
      # bestemt andet trin, uden at noget sagde det. Nu er den en forudsætning
      # på linje med checkout.
      - name: Byg produktionsskemaet
        run: node sql/tests/_schema.mjs > "$RUNNER_TEMP/skema.gen.sql"

      - name: Ækvivalenstest for ratingberegningen
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database ratingtest;'
          # `-b` gør, at fejl fra \ir-inkluderede filer også stopper kørslen.
          psql -h localhost -U postgres -d ratingtest -v ON_ERROR_STOP=1 -b -f rating_equivalence.sql

      # Lokale kåringer (A22): kører selve migreringen competition_awards.sql
      # og efterprøver kåringsreglerne — færdig runde/måned, delt sejr, guard,
      # idempotens, service_role. Egen database, så de to tests ikke kan
      # forurene hinandens skema.
      - name: Test af lokale kåringer
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database awardstest;'
          psql -h localhost -U postgres -d awardstest -v ON_ERROR_STOP=1 -b -f competition_awards.sql

      # Fejltelemetri (G42): tabellen client_errors + den admin-gatede RPC.
      # Kontrollerer BEGGE retninger — at en bruger kan skrive sin egen fejl og
      # ikke andres, og at ingen kan læse tabellen uden om RPC'en.
      - name: Test af fejltelemetrien
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database cetest;'
          psql -h localhost -U postgres -d cetest -v ON_ERROR_STOP=1 -b -f client_errors.sql

      # predictions.updated_at-triggeren (G13). En manglende trigger er usynlig
      # — feltet har en default, så en frisk række ser rigtig ud, og fejlen
      # viser sig først som et Analytics-tal, der er lidt for lavt.
      - name: Test af updated_at-triggeren
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database putest;'
          psql -h localhost -U postgres -d putest -v ON_ERROR_STOP=1 -b -f predictions_updated_at.sql

      # anon-grants (G50): kører migreringen og efterprøver BEGGE halvdele —
      # at anon mister tabel-adgangen, og at kilden (Supabases default
      # privileges for public) er lukket, så en tabel oprettet bagefter heller
      # ikke får den. Den anden halvdel er den, der betyder noget på sigt:
      # bredden var en regel og ikke en liste.
      - name: Test af anon-grants
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database anongrants;'
          psql -h localhost -U postgres -d anongrants -v ON_ERROR_STOP=1 -b -f anon_grants.sql

      # anon-grants, anden halvdel (G58): SEKVENSERNE, som #34s formulering
      # aldrig dækkede — ordet "tables" stod tre steder. Testen bevæger sig
      # bevidst også i den anden retning og kræver, at funktions-adgangen
      # OVERLEVER: `anon` skal kunne kalde `username_available()` før login, og
      # en oprydning, der tog den med, ville lukke nye brugere ude uden at vise
      # sig andre steder.
      - name: Test af anon-grants (sekvenser)
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database anongrantsfinish;'
          psql -h localhost -U postgres -d anongrantsfinish -v ON_ERROR_STOP=1 -b -f anon_grants_finish.sql

      # Brugernavne (G63): hele §6-løftet bygget op fra scriptet ALENE — længde,
      # case-insensitiv unikhed og opslaget. Testen ER gendannelsesvejen: indtil
      # august 2026 fandtes indekset og funktionen kun i den genererede
      # schema.sql, så et skema bygget fra sql/-scripterne lod to brugere hedde
      # det samme, og det ville først vise sig, når det skete.
      - name: Test af brugernavne-garantierne
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database usernametest;'
          psql -h localhost -U postgres -d usernametest -v ON_ERROR_STOP=1 -b -f username_constraints.sql

      # Navneskiftet (B29) — og den rettighed, det blev bygget oven på. Kører mod
      # det RIGTIGE skema og ikke et miniskema, fordi halvdelen af påstandene er
      # om grants og RLS: en påstand om, at noget er FORBUDT, kan ikke stilles
      # uden alle policies (G91).
      #
      # Den ene påstand, det hele hænger på, er en regression og ikke en feature:
      # `grant all on profiles to authenticated` lod enhver bruger sætte sin egen
      # `is_admin`, og det ER admin-vagten i fem funktioner. Testen har set hullet
      # stå åbent, før den lukker det.
      - name: Test af navneskift og profil-rettigheder
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database unavntest;'
          psql -h localhost -U postgres -d unavntest -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/skema.gen.sql" > /dev/null
          psql -h localhost -U postgres -d unavntest -v ON_ERROR_STOP=1 -b -f sql/tests/username_change.sql

      # Hele skrive-fladen (revisionen efter `B29`, 10. august 2026). `B29`s hul
      # var, at en policy afgrænser RÆKKEN og ikke KOLONNEN; revisionen viste, at
      # `profiles` var det eneste sted, det gjorde en forskel — men et svar fra en
      # bestemt dag er ikke en kontrol. Filen er revisionen skrevet som en
      # påstand: fortegnelsen over skrive-policies, ingen skrivbar view uden
      # `security_invoker`, og tyve fjendtlige skrivninger med hvert sit
      # forventede udfald.
      #
      # Måler RÆKKEANTAL og ikke fravær af en fejl: RLS uden en policy skjuler
      # bare rækkerne, så en fjendtlig UPDATE rammer nul rækker og svarer OK.
      - name: Test af skrive-fladen for en indlogget bruger
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database fladetest;'
          psql -h localhost -U postgres -d fladetest -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/skema.gen.sql" > /dev/null
          psql -h localhost -U postgres -d fladetest -v ON_ERROR_STOP=1 -b -f sql/tests/write_surface.sql

      # Invitationskoden er hemmeligheden igen (A40). Testen har TO halvdele, og
      # den anden er den vigtigste: den første viser, at en fremmed hverken kan
      # læse eller tilmelde sig en liga, hun ikke er med i — den anden, at
      # invitationen stadig kan tages imod. Smalnes policyerne uden at opslaget
      # flyttes, lukkes ikke et hul men hele join-flowet, og det ville blive
      # opdaget af den næste bruger frem for af os.
      #
      # Testen læser BEGGE migreringer i produktionens rækkefølge (#52 så #53) og
      # måler MELLEMTILSTANDEN imellem dem: at trin 1 alene ikke rører en eneste
      # policy. Det er dét, der gør den sikker at køre før udrulningen — og hele
      # grunden til, at migreringen er delt i to.
      - name: Test af invitations-opslaget og de smalnede policies
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database invitetest;'
          psql -h localhost -U postgres -d invitetest -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/skema.gen.sql" > /dev/null
          psql -h localhost -U postgres -d invitetest -v ON_ERROR_STOP=1 -b -f sql/tests/invite_lookup.sql

      # Invitationens ETIKET, læst uden login (`I7`/`A41`). Egen database, fordi
      # den skal kunne stille påstande om et skema, hvor #54 er den ENESTE
      # tilføjelse oven på produktionsskemaet.
      #
      # Den vigtigste påstand er den negative: `anon` må køre `invite_preview()`
      # og må stadig IKKE køre `invite_lookup()` eller `accept_invite()`. Det er
      # snittet mellem en billedtekst og en dør, og det er dét, der holder `A40`
      # på plads, mens `I7` åbner en sprække i muren med vilje.
      - name: Test af det anonyme invitations-preview
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database previewtest;'
          psql -h localhost -U postgres -d previewtest -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/skema.gen.sql" > /dev/null
          psql -h localhost -U postgres -d previewtest -v ON_ERROR_STOP=1 -b -f sql/tests/invite_preview.sql

      # anon-grants, tredje og sidste del (G96): FUNKTIONERNE, som #34 og #43
      # begge sagde eksplicit, at de ikke rørte.
      #
      # Trinnet er ikke kun en test af én migrering. Dens påstand om, at `anon`
      # kan nøjagtig TO funktioner i hele `public`, er den eneste vagt over en
      # regel, databasen ikke kan håndhæve selv: PostgreSQLs indbyggede default
      # giver PUBLIC — og dermed `anon` — EXECUTE på hver ny funktion, og den
      # kan ikke lukkes med `ALTER DEFAULT PRIVILEGES` (efterprøvet mod 16.13).
      # Hver ny funktion i `public` skal derfor selv bære sin `revoke execute …
      # from public`, og det er DETTE trin, der bliver rødt, hvis en glemmer den.
      #
      # Kører mod det rigtige skema: halvdelen af påstandene er, at
      # `authenticated` og `service_role` har præcis den adgang bagefter, de
      # havde før, og det kan kun måles, hvor alle funktionerne findes.
      - name: Test af anon-grants (funktioner)
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database anongrantsfunc;'
          psql -h localhost -U postgres -d anongrantsfunc -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/skema.gen.sql" > /dev/null
          psql -h localhost -U postgres -d anongrantsfunc -v ON_ERROR_STOP=1 -b -f sql/tests/anon_grants_functions.sql

      # Kontrollen af, hvad `anon` kan nå (G100). Jobbets FEMTE overvågning, og
      # den findes, fordi trinnet ovenfor måler `sql/schema.sql` og ikke
      # databasen: dumpet er først sandt efter en eksport, migreringerne køres i
      # hånden, og eksporten er en ugentlig mandagskørsel — så en funktion kunne
      # stå åben for `anon` i produktionen i op til en uge, uden at nogen
      # påstand nogen steder var rød. Kontrollen i sql/checks/ køres derfor af
      # job-heartbeat.yml mod PRODUKTION hver halve time, og af denne test mod
      # en tom engangsdatabase — samme fil begge steder.
      #
      # Tom database og ikke produktionsskemaet, modsat trinnet ovenfor: det,
      # der efterprøves her, er KONTROLLEN, og tre af dens fire tilstande findes
      # pr. konstruktion ikke i et skema, hvor #56 er kørt.
      #
      # Testen fandt undervejs, at `revoke … on all functions … from public`
      # ikke dækker PROCEDURER (efterprøvet mod 16.13). Der findes ingen i dag,
      # men kontrollen tæller dem med — en kontrol, der deler migreringens
      # blinde vinkel, kan ikke se den.
      - name: Test af kontrollen for anons rækkevidde
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database anonreach;'
          psql -h localhost -U postgres -d anonreach -v ON_ERROR_STOP=1 -b -f anon_routine_reach.sql

      # Oprettelsen af en liga er ÉN skrivning (G95). Den påstand, filen findes
      # for, er den negative kontrol: den samme fejl fremkaldes ad den GAMLE vej
      # (to statements), hvor ligaen bliver stående uden medlemmer. Uden den
      # halvdel måler den positive ingenting — den ville også være grøn, hvis
      # testens spærre aldrig ramte.
      #
      # Mod det rigtige skema, fordi funktionen er `security definer` og dermed
      # forbigår de to insert-policies, den afløser: påstanden om, at den ikke
      # lukker noget op, kan ikke stilles et sted, hvor policyerne ikke findes.
      - name: Test af liga-oprettelsen
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database creategrouptest;'
          psql -h localhost -U postgres -d creategrouptest -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/skema.gen.sql" > /dev/null
          psql -h localhost -U postgres -d creategrouptest -v ON_ERROR_STOP=1 -b -f sql/tests/create_group.sql

      # Læsefladen (A43): kolonne-grants på `profiles` og deltagerpolicyen.
      #
      # Mod det rigtige skema, fordi hele rækken er samspillet mellem
      # privilegier og policies: #51's UPDATE-kolonner, #53's
      # `competitions_select_involved`, `read profiles` og deltagertabellens tre
      # skrive-policies findes kun dér.
      #
      # Testen kører BEGGE migreringer og måler mellemtilstanden imellem dem —
      # #59 må ikke bryde den gamle klient, for ellers er den ikke sikker at
      # køre før frontend-mergen. Og den bærer tre påstande, der hver især er en
      # fejl, ingen gennemlæsning ville have fundet: en upsert med `returning *`
      # skal afvises (RETURNING er også en læsning), de to naive policies skal
      # udløse `42P17` på BÅDE deltagerlisten og `competitions`, og INGEN policy
      # må slå direkte op i `profiles` — et RLS-udtryk evalueres med den
      # kaldende rolles privilegier, så en policy, der læser `is_admin`, holder
      # op med at filtrere og begynder at fejle, når kolonnen lukkes.
      - name: Test af læsefladen
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database readscope;'
          psql -h localhost -U postgres -d readscope -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/skema.gen.sql" > /dev/null
          psql -h localhost -U postgres -d readscope -v ON_ERROR_STOP=1 -b -f sql/tests/read_scope.sql

      # Story Engine v1.2's kåringsregler (B10): kører rating_core +
      # competition_awards + story_engine i én tom database og efterprøver
      # kæden fra kåringsrække til historie-kort. Egen database, som de andre.
      #
      # Kæden går gennem tre filer og to skrivetidspunkter, og fejler den,
      # fejler den TAVST: matches-triggeren er exception-guarded, så et
      # manglende kort ikke kan skelnes fra en stille uge.
      - name: Test af Story Engines kåringsregler
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database storytest;'
          psql -h localhost -U postgres -d storytest -v ON_ERROR_STOP=1 -b -f story_engine_awards.sql

      # Story Engine v2's DAGLIGE historier. Den vigtigste påstand i filen er
      # ikke, at reglerne virker, men at runde-motoren IKKE sletter dagskort:
      # de to motorer deler tabel og round_key, og v1's uafgrænsede delete ville
      # tørre hele ugen væk ved hver resultatændring.
      #
      # Filen påstår desuden et IKKE-NUL rækkeantal. Det er ikke pedanteri: hele
      # kæden ligger bag matches-triggerens exception-guard, og den mest
      # sandsynlige fejl (en date/text-sammenligning) fejler TAVST — uden den
      # påstand ville en motor, der intet producerer, være grøn.
      - name: Test af Story Engines daglige historier
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database dailytest;'
          psql -h localhost -U postgres -d dailytest -v ON_ERROR_STOP=1 -b -f story_engine_daily.sql

      # Milepæle: permanente engangs-bedrifter. Testen vogter især de guards,
      # der gør en milepæl noget værd — feltstørrelse ("top 3 af 3" må ikke
      # uddeles), peak frem for nuværende rating, og at en konkurrence, der
      # stadig kan vokse, ikke meldes færdig. En uddelt milepæl kan ikke tages
      # tilbage, så fejlen er ikke til at rette bagefter.
      - name: Test af milepæle
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database mstest;'
          psql -h localhost -U postgres -d mstest -v ON_ERROR_STOP=1 -b -f milestones.sql

      # Sikkerhedsstramningen (G14/G15/G16): kører selve migreringen
      # security_hardening.sql og efterprøver BEGGE retninger — at anon og en
      # almindelig bruger er lukket ude af matches, recompute_ratings() og
      # monthly_standings, OG at admin, rating-triggeren og service_role stadig
      # kommer igennem. Egen database, som de to andre.
      - name: Test af sikkerhedsstramningen
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database sectest;'
          psql -h localhost -U postgres -d sectest -v ON_ERROR_STOP=1 -b -f security_hardening.sql

      # Feedback (B14): kører migreringen feedback.sql og efterprøver, at RLS
      # kun tillader insert af egne rækker, at INGEN bruger kan læse tabellen,
      # og at begge admin-RPC'er svarer 'forbidden' til en ikke-admin.
      - name: Test af feedback
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database fbtest;'
          psql -h localhost -U postgres -d fbtest -v ON_ERROR_STOP=1 -b -f feedback.sql

      # Unique-constraints på leverandør-id'erne (G7): efterprøver især, at de
      # tre LOVLIGE gentagelser stadig er lovlige — samme klub i to turneringer,
      # samme sæson-id i flere turneringer, samme liga-id hos to leverandører.
      # En for stram constraint her gør Champions League usynkroniserbar.
      #
      # Kørslen støjer med to FORVENTEDE fejl til sidst (vagten mod dubletter,
      # der findes i forvejen — se filens punkt 4). Den slår selv ON_ERROR_STOP
      # fra og til igen omkring dem, så et grønt trin betyder stadig, at alle
      # påstande holdt.
      - name: Test af unique-constraints på leverandør-id'er
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database idtest;'
          psql -h localhost -U postgres -d idtest -v ON_ERROR_STOP=1 -b -f api_id_uniqueness.sql

      # Kontolukning ved anonymisering (B4): efterprøver især den påstand, hele
      # valget hviler på — at brugerens tips, rating, kåringer OG den liga,
      # de oprettede, står uændret bagefter. En rigtig sletning ville have
      # kaskaderet ligaen væk og taget de andre medlemmer med.
      #
      # KØRER MOD DET RIGTIGE SKEMA SIDEN `G91` (9. august 2026), og skiftet var
      # ikke kosmetisk: filen testede indtil da #31's SELVSTÆNDIGE
      # `anonymize_my_account()` — en funktionskrop, ingen kører. Produktionen
      # kører `liga_admin.sql`s skal om `_anonymize_account()`, og den kan kun
      # læses oven på et skema, der har `matches` og `competition_matches`, fordi
      # `A25`s framelding spørger, om konkurrencen er begyndt.
      - name: Test af kontolukning
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database anontest;'
          psql -h localhost -U postgres -d anontest -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/skema.gen.sql" > /dev/null
          psql -h localhost -U postgres -d anontest -v ON_ERROR_STOP=1 -b -f sql/tests/account_anonymization.sql

      # Sæson-gaten (season_end.sql): en konkurrence, der KAN vokse, må ikke
      # meldes færdig, blot fordi dens kendte kampe har resultat — en sæson med
      # flere stages får først slutspillet skemalagt undervejs. Fejlen er
      # usynlig i data (viewet svarer bare "afsluttet"), og prisen betales et
      # helt andet sted: som en permanent milepæl, der ikke kan trækkes tilbage.
      - name: Test af sæson-gaten på competition_status
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database cstest;'
          psql -h localhost -U postgres -d cstest -v ON_ERROR_STOP=1 -b -f competition_status.sql

      # Administratorens grænser (liga_admin.sql). Begge retninger måles: en for
      # STRAM policy viser sig som en knap, der ikke virker, og bliver opdaget —
      # en for LØS viser sig som en andens historik, der forsvandt, og der er
      # ikke noget tilbage at opdage det på.
      #
      # KØRER MOD DET RIGTIGE SKEMA SIDEN `G91` (9. august 2026). Miniskemaet
      # målte de tre policies i et rum, hvor de andre ikke fandtes — og RLS er et
      # OR mellem permissive policies, så en påstand om, at noget er FORBUDT, kan
      # ikke stilles uden dem alle. Filens gamle påstand 4 var forkert af netop
      # den grund.
      - name: Test af administratorens grænser
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database admintest;'
          psql -h localhost -U postgres -d admintest -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/skema.gen.sql" > /dev/null
          psql -h localhost -U postgres -d admintest -v ON_ERROR_STOP=1 -b -f sql/tests/liga_admin.sql

      # Kontrollen af klokkeslæt (G84). Det eneste trin i jobbet, der tester en
      # OVERVÅGNING og ikke en migrering: forespørgslen i sql/checks/ læses af
      # job-heartbeat.yml mod produktion, og af denne test mod en tom
      # engangsdatabase — samme fil begge steder, så reglen kun findes ét sted.
      #
      # En kontrol er kode, der per definition næsten aldrig udløser, og det er
      # den værste slags at lade være uafprøvet: den ser rigtig ud, den kører
      # hver halve time, og den ville være tavs på nøjagtig samme måde, hvad
      # enten den virkede eller ej. Testen efterprøver derfor BEGGE retninger —
      # at augustfejlen ville have udløst alarm, og at fire normale tilstande
      # ikke gør — og den er selv efterprøvet ved at mutere kontrollen otte
      # gange og se testen fange hver enkelt.
      - name: Test af kontrollen for manglende klokkeslæt
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database kickofftest;'
          psql -h localhost -U postgres -d kickofftest -v ON_ERROR_STOP=1 -b -f kickoff_coverage.sql

      # Kontrollen af liga-administratorer (A37). Jobbets anden overvågning, og
      # den er skrevet efter samme model som G84's: forespørgslen i sql/checks/
      # er en temporær view, så den kan køres mod produktion UDEN at installere
      # noget, og mod en tom engangsdatabase her — samme fil begge steder.
      #
      # Testen skelner bevidst A37 fra A36: en lukket konto som almindeligt
      # MEDLEM må ikke gøre ligaen rød, for de to spørgsmål har modsatrettede
      # rettelser. Kontrollen er selv efterprøvet ved at mutere den syv gange og
      # se testen fange hver enkelt — G84's lære om, at en test, man ikke har
      # set fejle, er en formodning.
      - name: Test af kontrollen for liga-administratorer
        env:
          PGPASSWORD: postgres
        working-directory: sql/tests
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database ladmintest;'
          psql -h localhost -U postgres -d ladmintest -v ON_ERROR_STOP=1 -b -f league_admin_coverage.sql

      # Kontrollen af ratingens friskhed (G83). Jobbets tredje overvågning, og
      # den første, der kører mod det RIGTIGE skema frem for et håndskrevet
      # miniskema: kontrollen sammenligner `matches.round_key` (date, en
      # genereret kolonne) med `rating_history.round_key` (text), og et
      # miniskema ville have givet de to samme type og dermed bevist noget
      # andet end det, der kører i produktion.
      #
      # Testen bygger gendannelsens egen tilstand — rækker indlæst med
      # triggerne slået fra, præcis som RESTORE.md scenarie 1 foreskriver — og
      # spørger, om kontrollen kan se den. Den er selv efterprøvet ved at mutere
      # kontrollen ni gange og se testen fange hver enkelt; to af de ni slap
      # igennem den første udgave af testen og gav den påstand 8 og en fixture
      # mere.
      - name: Test af kontrollen for ratingens friskhed
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database ratingfresh;'
          psql -h localhost -U postgres -d ratingfresh -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/skema.gen.sql" > /dev/null
          psql -h localhost -U postgres -d ratingfresh -v ON_ERROR_STOP=1 -b -f sql/tests/rating_freshness.sql

      # Kontrollen af dagskortene (G93). Jobbets fjerde overvågning, og den
      # sidste af de fire i `sql/checks/`, der fik en test.
      #
      # DEN STÅR HER OG IKKE VED SINE TO SØSKENDE længere oppe, fordi den kræver
      # `$RUNNER_TEMP/skema.gen.sql`, som trinnet ovenfor bygger. Grunden til det
      # rigtige skema er den samme som `rating_freshness`': kontrollen grupperer
      # på `matches.match_day` og sammenligner `matches.round_key` med
      # `round_key_of_date()` — to GENEREREDE kolonner oven på tidszonelogikken —
      # og et miniskema ville have gjort dem til kolonner, testen selv udfyldte.
      # Skemaet bærer desuden `stories_day_key_shape`, som er dét, der gør
      # kontrollens `period = 'day'`-filter uangribeligt.
      #
      # Rækken blev skrevet, fordi kontrollen var den eneste i `sql/checks/` uden
      # et bevis for sig selv — og det var netop derfor, den kunne stå grøn under
      # `G92`, mens reglen bag den fejlede. Testen er selv efterprøvet ved at
      # mutere kontrollen ti gange og se den fange hver enkelt.
      - name: Test af kontrollen for dagskortene
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database daycardtest;'
          psql -h localhost -U postgres -d daycardtest -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/skema.gen.sql" > /dev/null
          psql -h localhost -U postgres -d daycardtest -v ON_ERROR_STOP=1 -b -f sql/tests/day_card_coverage.sql

      # Læsepolicyen på competition_matches (G94). Kører mod det RIGTIGE skema,
      # og her er der ikke noget valg: en påstand om en RLS-policy kan kun
      # stilles, hvis de andre policies er der — `G91` betalte for den lære — og
      # påstand 3 går gennem `competition_status`, en `security_invoker`-view,
      # som slet ikke findes i et miniskema.
      #
      # Skemaet indlæses FØR migreringen, fordi `sql/schema.sql` stadig bærer den
      # GAMLE policy: trinnet gør dermed præcis det, en kørsel i Supabase gør.
      # Testen kræver desuden af sig selv, at fixturen viser fejlen FØR
      # migreringen læses — uden det kunne påstand 3 bestå på en harmløs fixture.
      - name: Test af læsepolicyen på competition_matches
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database cmreadtest;'
          psql -h localhost -U postgres -d cmreadtest -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/skema.gen.sql" > /dev/null
          psql -h localhost -U postgres -d cmreadtest -v ON_ERROR_STOP=1 -b -f sql/tests/competition_matches_read.sql

      # De ubekræftede klokkeslæt (G85). Kører mod det RIGTIGE skema af tre
      # grunde, som et miniskema ikke kan levere: triggeren, der gemmer den
      # forrige tid, ligger på `public.matches` SAMMEN med de tre statement-level
      # rating-triggere; `analytics_match_locks` er det view, påstanden om låsen
      # læses af; og `round_key`/`match_day` er genererede kolonner oven på
      # tidszonelogikken. `G91` (9. august 2026) flyttede de sidste to store
      # tests herover af samme grund.
      #
      # Påstand 8 er den, der bærer selve beslutningen: markøren er DISPLAY-ONLY,
      # og låsen skal give præcis samme svar før og efter markeringen. Havde vi
      # genbrugt `kickoff_tbd`, ville den påstand have fejlet med 16 timer.
      #
      # Testen er selv efterprøvet ved at mutere migreringen ni gange — gulvet i
      # begge retninger, begge sæsonfiltre, den lærte kolonne, ryddegrenen,
      # triggerens betingelse og tidssammenligningen — og se den fange hver
      # enkelt. To af de ni slap igennem den første udgave og gav fixturen en
      # Serie A-kamp mere og migreringen én betingelse mindre.
      - name: Test af de ubekræftede klokkeslæt
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database kickoffuncertain;'
          psql -h localhost -U postgres -d kickoffuncertain -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/skema.gen.sql" > /dev/null
          psql -h localhost -U postgres -d kickoffuncertain -v ON_ERROR_STOP=1 -b -f sql/tests/kickoff_uncertain.sql

      # Rydningen af analytics_events (G77). Et `delete` mod brugerdata, hvor
      # hele sikkerheden ligger i én sammenligning — og en fejl i den er ikke en
      # fejlbesked, men en tom tabel. Testen prøver begge retninger og gulvet.
      - name: Test af rydningen i analytics_events
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database analyticsretention;'
          psql -h localhost -U postgres -d analyticsretention -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/skema.gen.sql" > /dev/null
          psql -h localhost -U postgres -d analyticsretention -v ON_ERROR_STOP=1 -b -f sql/tests/analytics_retention.sql

      # Sæson-simulatoren (G82). Jobbets TUNGESTE trin — ~10 sekunder — og det
      # er hele prisen ved rækken: 1.069 linjer SQL, der indtil august 2026 kun
      # var efterprøvet i hånden mod en lokal PG16.
      #
      # Filen kan ikke testes mod et miniskema som de øvrige her: den rører hele
      # kæden på én gang (ligaer, sæsoner, hold, kampe, tips, matches-triggeren,
      # rating, historier, kåringer, milepæle, competition_status), og det er
      # netop sammenstødet med det RIGTIGE skema, der er værd at prøve.
      #
      # Den mest lærerige påstand er determinismen: filens hoved lover "samme
      # frø + samme kald = samme sæson", og den anden halvdel af det løfte er
      # ikke pynt — tips og resultater deler `random()`-strøm, så en gentagelse,
      # der springer et kald over, får et andet facit uden at noget er galt.
      - name: Test af sæson-simulatoren
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database simtest;'
          psql -h localhost -U postgres -d simtest -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/skema.gen.sql" > /dev/null
          psql -h localhost -U postgres -d simtest -v ON_ERROR_STOP=1 -b -f sql/tests/simulate_season.sql

      # Deltagerens nulpunkt (A53). Måler BEGGE steder, konkurrence-point
      # beregnes i SQL — viewet `competition_match_points` (Story Engine og
      # milepælene læser kun igennem det) og `award_competition_periods()`, som
      # har sine egne inline-joins. Fixturen giver fire spillere NØJAGTIG samme
      # gæt og kun forskellige tilmeldingstidspunkter, så intet andet kan
      # forklare en forskel i stillingen.
      - name: Test af deltagerens nulpunkt
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database joinbaseline;'
          psql -h localhost -U postgres -d joinbaseline -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/skema.gen.sql" > /dev/null
          psql -h localhost -U postgres -d joinbaseline -v ON_ERROR_STOP=1 -b -f sql/tests/competition_join_baseline.sql

      # Ligaens to tal (G106). Måler dét, der gør et view til svaret frem for
      # en fan-out: `security_invoker`. Den vigtigste påstand er den negative —
      # en fremmed må ikke få en RÆKKE, ikke bare et forkert tal — og den ville
      # fejle ved et enkelt glemt `with (security_invoker = on)`.
      - name: Test af ligaens optælling
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database groupcounts;'
          psql -h localhost -U postgres -d groupcounts -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/skema.gen.sql" > /dev/null
          psql -h localhost -U postgres -d groupcounts -v ON_ERROR_STOP=1 -b -f sql/tests/group_counts.sql

      # Karriereprofilens indbyrdes opgør (G107). Funktionen havde ingen
      # SQL-test overhovedet indtil 14. august 2026. Den bærende påstand er
      # invarianten fra spec'ens testcase 41: `rivals`-posten om en person og
      # `h2h`-linjen på den persons profil er den samme påstand set fra hver sin
      # side, så de to blokke kan ikke rettes hver for sig.
      - name: Test af karriereprofilens opgør
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database careerprofile;'
          psql -h localhost -U postgres -d careerprofile -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/skema.gen.sql" > /dev/null
          psql -h localhost -U postgres -d careerprofile -v ON_ERROR_STOP=1 -b -f sql/tests/career_profile.sql

      # Nulpunktets hukommelse (G108). Kører BEGGE nulpunkts-migreringer, fordi
      # `#63` er meningsløs uden `#61`. To påstande bærer filen: at en HELT ny
      # deltager stadig får nul (ellers er `A53` sat ud af kraft), og at en
      # RI-cascade stadig går igennem — uden guarden ville en slettet
      # konkurrence eller en lukket konto fejle med 23503.
      - name: Test af nulpunktets hukommelse
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database participantbaseline;'
          psql -h localhost -U postgres -d participantbaseline -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/skema.gen.sql" > /dev/null
          psql -h localhost -U postgres -d participantbaseline -v ON_ERROR_STOP=1 -b -f sql/tests/competition_participant_baseline.sql

      # SQL-blokkene i docs/ (G74). Det eneste trin i jobbet, der ikke tester en
      # migrering, men DOKUMENTATIONEN: hver ```sql-blok bygges om til et
      # `prepare` mod hele sql/schema.sql, så PostgreSQL selv siger, om
      # forespørgslen kunne køre. `prepare` uden `execute` rører ingen rækker —
      # også et `update` i et dokument er derfor ufarligt at tjekke.
      #
      # Trinnet kræver Node, som kun `verify`-jobbet ellers har. Det er billigt
      # nok: udtrækkeren bruger ingen afhængigheder, så der er intet `npm ci`.
      #
      # Baggrunden er `B12`, hvis forespørgsel stod to døgn som "klar til at
      # køre" og blev afvist med `42803`, første gang nogen prøvede. Et rent
      # syntakstjek ville ikke have fanget den — fejlen opstår i parse-analysen
      # og kræver, at serveren kender tabellerne.
      - name: Test af SQL-blokkene i docs/
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          node sql/tests/docs_sql.mjs > "$RUNNER_TEMP/docs_sql.gen.sql"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database docssql;'
          psql -h localhost -U postgres -d docssql -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/docs_sql.gen.sql"
