name: Skema-eksport

# Regenererer sql/schema.sql fra produktionsdatabasen (Vej 1 i sql/README.md).
#
# Kører på GitHub's runnere, som — i modsætning til web-sandkassen — har fri
# netadgang til Supabase på port 5432. Krav: repo-secret SUPABASE_DB_URL med
# session-pooler-strengen, fx:
#   postgresql://postgres.<ref>:<password>@aws-0-eu-west-1.pooler.supabase.com:5432/postgres
# (Settings → Secrets and variables → Actions → New repository secret.)
#
# ---------------------------------------------------------------------------
# 🔴 WORKFLOWEN KAN IKKE COMMITTE TIL STANDARDGRENEN, OG DET ER MED VILJE
#
# Indtil 12. august 2026 committede den til den ref, den blev dispatchet på —
# og cron-kørslen dispatches pr. definition på standardgrenen. Følgen var, at
# `sql/schema.sql` landede i `main` **uden at have været gennem CI**.
#
# Det er ikke en teoretisk risiko. Dumpet er reference for de skema-indlæsende SQL-tests, og
# **tre gange har en eksport gjort CI rød bagefter**:
#
#   · `G94` — `competition_matches_read.sql` lånte sin før-tilstand af dumpet.
#   · `G98` — `create_group.sql`s negative kontrol blev et tavst no-op.
#   · `G96` — `anon_grants_functions.sql` blev rød af, at arbejdet lykkedes.
#
# Fællesnævneren er, at eksporten er det ENESTE, der flytter dumpet, og at en
# test, der læser sin før-tilstand af det, først falder i det sekund den kører.
# Rækkefølgen "eksportér → se CI → merge" fanger dem alle tre; rækkefølgen
# "eksportér ind i main → opdag det bagefter" fanger ingen af dem.
#
# Derfor to veje ud af dette job, og valget er automatisk:
#
#   · **Arbejdsgren** → commit direkte på den. Dumpet kommer gennem CI som en
#     del af den pull request, grenen alligevel skal have. Det er den vej, en
#     migrering bør bruge: kør eksporten på din egen gren, når SQL'en er kørt.
#   · **Standardgren** (cron, eller en manuel dispatch på `main`) → dumpet
#     skubbes til `chore/schema-export`, og der åbnes en pull request. Det
#     ugentlige sikkerhedsnet er dermed intakt — det melder stadig skema-drift
#     — men det melder den som noget, der skal ses på, og ikke som et fait
#     accompli i produktionsgrenen.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1"   # hver mandag kl. 06:00 UTC — sikkerhedsnet mod skema-drift

permissions:
  contents: write
  pull-requests: write   # kun brugt på standardgrens-vejen (gh pr create)

concurrency:
  group: schema-export-${{ github.ref }}
  cancel-in-progress: false

env:
  # Grenen, standardgrens-vejen skubber til. Stabil med vilje: en gen-kørsel
  # opdaterer den samme pull request frem for at åbne en ny hver mandag.
  PR_GREN: chore/schema-export

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Tjek branchens SPIDS ud, ikke den SHA der var gældende ved dispatch.
          # Uden dette arbejder en kørsel, der har ventet i kø (concurrency), videre
          # på en forældet base — og dens push afvises som non-fast-forward, selvom
          # eksporten i sig selv lykkedes.
          ref: ${{ github.ref_name }}

      - name: Installér pg_dump (PostgreSQL 17-klient)
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # Runneren har pg_dump 16 forudinstalleret på PATH; læg pg17-binæren forrest,
          # ellers fejler dumpet med "server version mismatch" mod Supabases PG 17-server.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Eksportér public-skema → sql/schema.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Secret SUPABASE_DB_URL mangler. Tilføj den under Settings → Secrets and variables → Actions."
            exit 1
          fi
          pg_dump "$SUPABASE_DB_URL" \
            --schema=public \
            --schema-only \
            --no-owner \
            -f "$RUNNER_TEMP/krop.sql"

          # -------------------------------------------------------------
          # G112 — advarslen skal stå DÉR, hvor nogen ville skrive
          #
          # `sql/schema.sql` er et genereret øjebliksbillede, men sagde det
          # kun i CLAUDE.md og sql/README.md — altså to steder, ingen læser,
          # når de har filen åben. En håndredigering i den bliver TAVST
          # overskrevet ved næste eksport: ingen fejl, ingen konflikt, bare
          # arbejde, der forsvinder.
          #
          # DATOEN er den halvdel, der også hjælper læseren: dumpet er kun en
          # gyldig reference, når eksporten er kørt efter seneste migrering,
          # og det kunne indtil nu ikke ses på filen.
          #
          # 🔴 **Datoen er "sidst ÆNDRET", ikke "sidst KØRT", og det er ikke en
          # sproglig detalje.** Skrev hovedet kørselsdatoen, ville hver eneste
          # mandagskørsel producere en diff, også når skemaet stod stille — og
          # på standardgrens-vejen nedenfor ville det åbne en
          # "skema-drift"-pull request UDEN drift i, hver uge. Trinnet "Commit
          # hvis ændret" sammenligner derfor KROPPENE og lader hovedet stå,
          # når kun datoen ville flytte sig.
          HOVED="$RUNNER_TEMP/hoved.sql"
          {
            echo "-- ==========================================================================="
            echo "-- 🔴 GENERERET FIL — REDIGÉR IKKE"
            echo "--"
            echo "-- Skrevet af .github/workflows/schema-export.yml (pg_dump --schema=public"
            echo "-- --schema-only --no-owner) mod produktionsdatabasen. En håndredigering her"
            echo "-- bliver TAVST overskrevet ved næste eksport: ingen fejl, ingen konflikt,"
            echo "-- bare arbejde, der forsvinder. Skal skemaet ændres, skrives en migrering i"
            echo "-- sql/ og køres i Supabases SQL-editor — se sql/README.md."
            echo "--"
            echo "-- Skemaet ændrede sig sidst: $(date -u +%Y-%m-%d)"
            echo "--"
            echo "-- DATOEN ER FILENS HOLDBARHED, ikke dens kørselsstempel. Den står stille,"
            echo "-- når en eksport ikke fandt noget nyt, og siger dermed \"skemaet er uændret"
            echo "-- siden\". Er en migrering kørt i produktionen EFTER den dato, er denne fil"
            echo "-- bagud — og det er den tilstand, sql/checks/anon_routine_reach.sql findes"
            echo "-- for at kunne se, fordi CI's egne vagter måler netop dette dump (G124)."
            echo "-- =================== SLUT PÅ GENERERET HOVED ==================="
          } > "$HOVED"
          cat "$HOVED" "$RUNNER_TEMP/krop.sql" > sql/schema.sql
          echo "Skrev sql/schema.sql ($(wc -l < sql/schema.sql) linjer, heraf $(wc -l < "$HOVED") linjers hoved)."

      - name: Verifikationstjekliste
        run: |
          set -euo pipefail
          fail=0

          # 1. Filen findes og er ikke tom
          if [ -s sql/schema.sql ]; then echo "OK 1: filen er ikke-tom"; else echo "FEJL 1: filen er tom/mangler"; fail=1; fi

          # 2. Ingen data (kun skema) → forvent 0
          n=$(grep -cE '^(COPY|INSERT) ' sql/schema.sql || true)
          if [ "$n" -eq 0 ]; then echo "OK 2: ingen data-linjer"; else echo "FEJL 2: fandt $n COPY/INSERT-linjer"; fail=1; fi

          # 3. Ingen ejer-info → forvent 0
          n=$(grep -c 'OWNER TO' sql/schema.sql || true)
          if [ "$n" -eq 0 ]; then echo "OK 3: ingen OWNER TO"; else echo "FEJL 3: fandt $n OWNER TO-linjer"; fail=1; fi

          # 4. Grants er med → forvent > 0
          n=$(grep -c '^GRANT ' sql/schema.sql || true)
          if [ "$n" -gt 0 ]; then echo "OK 4: $n GRANT-linjer"; else echo "FEJL 4: ingen GRANT-linjer"; fail=1; fi

          # 5. Skemaet er fyldt → forvent > 0
          n=$(grep -c 'CREATE TABLE' sql/schema.sql || true)
          if [ "$n" -gt 0 ]; then echo "OK 5: $n CREATE TABLE"; else echo "FEJL 5: ingen CREATE TABLE"; fail=1; fi

          # 6. Kun public-skemaet → ingen auth./storage.-objekter
          other=$(grep -oE 'CREATE (TABLE|FUNCTION|VIEW) [a-z_]+\.' sql/schema.sql | sort -u | grep -v ' public\.' || true)
          if [ -z "$other" ]; then echo "OK 6: kun public.-objekter"; else echo "FEJL 6: fandt ikke-public objekter:"; echo "$other"; fail=1; fi

          # 7. Advarslen står i filen (G112) → forvent begge markører
          # Uden dette tjek kunne hovedet forsvinde ved en omskrivning af
          # trinnet ovenfor, uden at nogen så det: filen ville stadig være et
          # gyldigt skema, bare uden det ene, der siger, at den er genereret.
          # Slutmarkøren tælles med, fordi det er DEN, kropssammenligningen
          # nedenfor klipper på — mangler den, committer jobbet ved hver kørsel.
          if grep -q '^-- 🔴 GENERERET FIL — REDIGÉR IKKE$' sql/schema.sql \
             && grep -q '^-- =\{3,\} SLUT PÅ GENERERET HOVED =\{3,\}$' sql/schema.sql; then
            echo "OK 7: det genererede hoved står i filen"
          else
            echo "FEJL 7: hovedet mangler eller er omskrevet"; fail=1
          fi

          if [ "$fail" -ne 0 ]; then echo "::error::Verifikationstjeklisten fejlede."; exit 1; fi
          echo "Alle tjek bestået."

      - name: Commit hvis ændret
        env:
          GH_TOKEN: ${{ github.token }}
          GREN: ${{ github.ref_name }}
          STANDARD: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ---------------------------------------------------------------
          # KROPPEN afgør, om der er en ændring — ikke hovedet (G112)
          #
          # Hovedet bærer en dato, og en dato flytter sig hver uge. Målte vi
          # hele filen, ville hver mandagskørsel se en ændring, committe den
          # og — på standardgrens-vejen nedenfor — åbne en pull request med
          # titlen "skema-drift opdaget", hvor det eneste, der drev, var
          # kalenderen. En alarm, der er falsk hver uge, lærer man at holde op
          # med at læse (samme afvejning som `Notify after 3` i cron-job.org).
          #
          # Derfor: klip hovedet af begge udgaver og sammenlign resten. Er de
          # ens, lægges HEAD's udgave tilbage, så også datoen står stille — og
          # dét er hvad den skal, fordi den siger "uændret siden".
          krop() { sed '1,/^-- =\{3,\} SLUT PÅ GENERERET HOVED =\{3,\}$/d' "$1"; }

          git show "HEAD:sql/schema.sql" > "$RUNNER_TEMP/head.sql" 2>/dev/null || : > "$RUNNER_TEMP/head.sql"
          krop "$RUNNER_TEMP/head.sql" > "$RUNNER_TEMP/head.krop"
          krop sql/schema.sql          > "$RUNNER_TEMP/ny.krop"

          if [ -s "$RUNNER_TEMP/head.krop" ] && cmp -s "$RUNNER_TEMP/head.krop" "$RUNNER_TEMP/ny.krop"; then
            echo "Skemaet er uændret — kun hovedets dato ville flytte sig. Lægger HEAD's udgave tilbage."
            git checkout -- sql/schema.sql
            exit 0
          fi

          if git diff --quiet -- sql/schema.sql; then
            echo "Ingen ændringer i sql/schema.sql — intet at committe."
            exit 0
          fi

          BESKED="chore(sql): opdatér skema-eksport (schema.sql)"

          # ---------------------------------------------------------------
          # VEJ A — arbejdsgren: commit direkte. Dumpet kommer gennem CI som
          # en del af grenens egen pull request.
          # ---------------------------------------------------------------
          if [ "$GREN" != "$STANDARD" ]; then
            echo "Kører på arbejdsgrenen '$GREN' — committer direkte."
            # Dumpet er autoritativt: filen er netop genereret ud fra produktions-
            # databasen. Skubber nogen til branchen imens (fx en overlappende kørsel
            # eller en merge), afvises vores push. Så henter vi den nyeste ref, lægger
            # vores friske dump ovenpå og prøver igen — der er intet at flette, fordi
            # filen er genereret og ikke redigeret.
            cp sql/schema.sql /tmp/schema.sql
            for forsog in 1 2 3; do
              git add sql/schema.sql
              git commit -m "$BESKED" --quiet || true
              if git push origin "HEAD:$GREN"; then
                echo "Committede og pushede opdateret sql/schema.sql til $GREN."
                exit 0
              fi
              echo "Push afvist (forsøg $forsog/3) — henter nyeste ref og lægger dumpet ovenpå."
              git fetch origin "$GREN"
              git reset --hard --quiet "origin/$GREN"
              cp /tmp/schema.sql sql/schema.sql
              if git diff --quiet -- sql/schema.sql; then
                echo "Nyeste ref indeholder allerede præcis dette skema — intet at gøre."
                exit 0
              fi
            done
            echo "::error::Kunne ikke pushe sql/schema.sql efter 3 forsøg."
            exit 1
          fi

          # ---------------------------------------------------------------
          # VEJ B — standardgren: ALDRIG et direkte commit. Dumpet skubbes til
          # PR_GREN, og der åbnes en pull request, så CI ser det før mergen.
          # ---------------------------------------------------------------
          echo "Kører på standardgrenen '$STANDARD' — committer IKKE her. Åbner en pull request i stedet."

          # `--force` er det rigtige her, og kun her: PR_GREN er maskinskrevet,
          # ejes udelukkende af dette job, og bygges hver gang oven på
          # standardgrenens spids. Der er intet menneskearbejde at overskrive.
          git checkout -B "$PR_GREN"
          git add sql/schema.sql
          git commit -m "$BESKED" --quiet
          git push --force origin "HEAD:$PR_GREN"
          echo "Pushede dumpet til $PR_GREN."

          ANTAL=$(gh pr list --head "$PR_GREN" --state open --json number --jq 'length')
          if [ "$ANTAL" -gt 0 ]; then
            NR=$(gh pr list --head "$PR_GREN" --state open --json number --jq '.[0].number')
            echo "Pull request #$NR findes i forvejen og er opdateret af pushet."
            echo "::notice::Skema-drift: PR #$NR er opdateret med et friskt dump."
            exit 0
          fi

          # PR-teksten skrives til en fil frem for at stå i et heredoc inde i
          # kommandoen: et heredoc, hvis krop står i kolonne 0, afslutter YAML'ens
          # blok-skalar og gør hele filen usyntaktisk. Den fælde koster en rød
          # kørsel og ligner ikke sin årsag.
          cat > /tmp/pr-body.md <<'PRBODY'
          Den ugentlige skema-eksport fandt, at `sql/schema.sql` ikke længere svarer til
          produktionsdatabasen, og har lagt et friskt dump her.

          **Det er ikke automatisk en fejl.** En migrering er lovligt forud for eksporten
          — de køres i hånden i Supabases SQL-editor, mens eksporten er ugentlig. Men det
          er værd at se på, hvad diff'en indeholder, før den merges:

          - Svarer den til migreringer, du kender? Så er alt, som det skal være.
          - Er der objekter, ingen fil i `sql/` opretter? Så er der lavet noget i hånden
            direkte i produktionen, og det bør have en migrering.

          **Merge først, når CI er grøn.** Dumpet er reference for de skema-indlæsende SQL-tests, og
          tre gange har en eksport gjort CI rød bagefter (`G94`, `G98`, `G96`) — altid
          fordi en test lånte sin før-tilstand af netop denne fil. Det er hele grunden
          til, at eksporten ikke længere committer direkte til standardgrenen.

          **Diff'ens størrelse er i sig selv en påstand:** er den ~2.400 linjer i stedet
          for et par hundrede, er CRLF i funktionskroppene blevet normaliseret undervejs,
          og en rigtig ændring kan gemme sig i støjen (`G5`). Så skal den ikke merges.
          PRBODY

          # Slår dette fejl med 403, er det næsten altid ÉN indstilling:
          # Settings → Actions → General → Workflow permissions →
          # "Allow GitHub Actions to create and approve pull requests".
          if ! gh pr create \
                --base "$STANDARD" \
                --head "$PR_GREN" \
                --title "chore(sql): skema-drift opdaget — friskt dump af public" \
                --body-file /tmp/pr-body.md; then
            echo "::error::Kunne ikke oprette pull requesten. Tjek Settings → Actions → General → Workflow permissions → 'Allow GitHub Actions to create and approve pull requests'. Dumpet ligger allerede på grenen $PR_GREN, så en PR kan også åbnes i hånden."
            exit 1
          fi
          echo "::notice::Skema-drift opdaget — pull request åbnet fra $PR_GREN."
