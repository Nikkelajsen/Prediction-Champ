name: Job-heartbeat

# Slår alarm, når et planlagt job holder op med at melde sig, eller fejler
# gentagne gange.
#
# HVORFOR DEN LIGGER HER OG IKKE I APPEN
# job_runs (sql/job_runs.sql) kan kun se de kørsler, der faktisk fandt sted. Et
# job, cron-job.org har auto-deaktiveret efter gentagne fejl, skriver INGEN
# rækker — og tavshed ligner ro. Overvågningen skal derfor stå uden for det, den
# overvåger: kører Supabase eller Vercel ikke, ville en alarm inde i appen dø af
# præcis samme årsag som jobbet.
#
# Alarmkanalen er GitHub selv: fejler denne workflow, sender GitHub en
# notifikation til repoets ejer. Det kræver ingen ny infrastruktur og er
# uafhængigt af app'ens egen push-kæde.
#
# Krav: repo-secret SUPABASE_DB_URL (samme som skema-eksporten bruger).
# Jobbene og deres forventede kadence står i docs/CRON.md — hold de to ens.

on:
  workflow_dispatch: {}
  schedule:
    # Hver halve time (G46). Kørte indtil august 2026 hver 6. time, hvilket ikke
    # passede til det, den overvåger: sync-live har en tavshedsgrænse på 30
    # minutter, så et dødt live-job kunne være usynligt næsten en hel kampdag —
    # netop de timer, hvor det betyder mest, og hvor brugerne står med forkerte
    # stillinger. En overvågning, der kigger sjældnere end den grænse, den
    # håndhæver, håndhæver den i praksis ikke.
    #
    # Prisen er 48 kørsler i døgnet à ~20 sekunder. Repoet er offentligt, så
    # GitHub Actions er gratis; bliver det privat igen, er dette tallet at kigge
    # på først. GitHub kører i øvrigt planlagte workflows med forsinkelse under
    # belastning, så kadencen er et loft for hyppigheden, ikke en garanti.
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: job-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Runneren har en psql-klient forudinstalleret. Modsat pg_dump er psql
      # ikke kræsen med serverversionen for almindelige forespørgsler, så her
      # er der ingen grund til at installere pg17-klienten som i skema-eksporten.
      # Rydningen af job_runs bor HER og ikke i et cron-job (G43).
      #
      # docs/CRON.md påstod, at tabellen blev ryddet med prune_job_runs(30),
      # men funktionen havde ingen kaldere — hverken et job eller kode. sync-live
      # alene skriver ~525.000 rækker om året, så tabellen voksede uden loft, og
      # Admin → Drift blev langsommere med tiden. Et register, der beskriver en
      # rydning, som ikke sker, er værre end ingen rydning: ingen leder efter
      # problemet.
      #
      # Denne workflow er stedet, fordi den allerede har databaseadgangen og
      # allerede kører på et skema — en rydning er ét ekstra udsagn frem for et
      # nyt endpoint, et nyt cron-job og en ny række i registeret. Den kører FØR
      # helbredstjekket, så et rødt tjek ikke afbryder den; 30 dages historik er
      # rigeligt til at aflæse et mønster, og rækker ældre end det kan hverken
      # gøre tjekket rødt eller grønt.
      - name: Ryd gamle job_runs
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Secret SUPABASE_DB_URL mangler. Tilføj den under Settings → Secrets and variables → Actions."
            exit 1
          fi
          slettet=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select public.prune_job_runs(30);")
          echo "Ryddede $slettet rækker ældre end 30 dage fra job_runs."

      - name: Tjek jobbenes helbred
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Secret SUPABASE_DB_URL mangler. Tilføj den under Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Tavshedsgrænserne er sat rundhåndet i forhold til kadencen i
          # docs/CRON.md, så et enkelt sprunget interval ikke larmer:
          #   sync-live          hvert minut        → alarm efter 30 min
          #   send-notifications hver 15.-30. minut → alarm efter 3 timer
          #   sync-matches       hver 12. time      → alarm efter 26 timer
          #
          # Kampprogram-jobbene UDLEDES af leagues-tabellen (G44) frem for at
          # stå skrevet her. Ét job pr. turnering, navngivet med liga-UUID'en af
          # api/_shared.js' syncMatchesJob(), så en ny turnering automatisk bliver
          # forventet — og en turnering, hvis job er dødt, ikke længere kan gemme
          # sig bag de seks andre. Turneringer uden api_league_id kan pr.
          # definition ikke synkronisere og forventes derfor ikke.
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -F'|' > rapport.txt <<'SQL'
          with forventet(job, navn, taalt_stilhed) as (
            select 'sync-live', 'sync-live', interval '30 minutes'
            union all
            select 'send-notifications', 'send-notifications', interval '3 hours'
            union all
            select 'sync-matches:' || l.id, 'sync-matches ' || l.name, interval '26 hours'
              from public.leagues l
             where l.api_league_id is not null
          ),
          seneste as (
            select f.job, f.navn,
                   (select max(r.started_at) from job_runs r where r.job = f.job) as sidst,
                   (select max(r.started_at) from job_runs r where r.job = f.job and r.ok) as sidst_ok,
                   f.taalt_stilhed
            from forventet f
          )
          select navn,
                 coalesce(to_char(sidst, 'YYYY-MM-DD HH24:MI'), 'aldrig'),
                 case
                   when sidst is null then 'INGEN KOERSLER'
                   when now() - sidst > taalt_stilhed then 'TAVS'
                   else 'ok'
                 end,
                 (select count(*) from job_runs f2
                   where f2.job = seneste.job
                     and f2.ok is distinct from true
                     and (sidst_ok is null or f2.started_at > sidst_ok))
          from seneste
          order by navn;
          SQL

          echo "Job | Sidste kørsel | Tilstand | Fejl i træk"
          echo "--------------------------------------------"
          fail=0
          while IFS='|' read -r job sidst tilstand fejlserie; do
            [ -z "$job" ] && continue
            printf '%-34s %-18s %-15s %s\n' "$job" "$sidst" "$tilstand" "$fejlserie"

            if [ "$tilstand" = "TAVS" ]; then
              echo "::error::$job har ikke meldt sig siden $sidst. Tjek om cron-job.org har deaktiveret jobbet (se docs/CRON.md)."
              fail=1
            elif [ "$tilstand" = "INGEN KOERSLER" ]; then
              # Ikke en fejl i sig selv: sådan ser det ud, indtil sql/job_runs.sql
              # er kørt i produktion og jobbene har nået at melde sig første gang.
              echo "::warning::$job har aldrig meldt sig. Er sql/job_runs.sql kørt, og er jobbet oprettet?"
            fi

            if [ "${fejlserie:-0}" -ge 3 ]; then
              echo "::error::$job er fejlet $fejlserie gange i træk. Se job_runs.error i Admin → Drift."
              fail=1
            fi
          done < rapport.txt

          if [ "$fail" -ne 0 ]; then
            echo "::error::Mindst ét planlagt job kræver opmærksomhed."
            exit 1
          fi
          echo "Alle jobs melder sig som forventet."
