name: Job-heartbeat

# Slår alarm, når et planlagt job holder op med at melde sig, eller fejler
# gentagne gange.
#
# HVORFOR DEN LIGGER HER OG IKKE I APPEN
# job_runs (sql/job_runs.sql) kan kun se de kørsler, der faktisk fandt sted. Et
# job, cron-job.org har auto-deaktiveret efter gentagne fejl, skriver INGEN
# rækker — og tavshed ligner ro. Overvågningen skal derfor stå uden for det, den
# overvåger: kører Supabase eller Vercel ikke, ville en alarm inde i appen dø af
# præcis samme årsag som jobbet.
#
# Alarmkanalen er GitHub selv: fejler denne workflow, sender GitHub en
# notifikation til repoets ejer. Det kræver ingen ny infrastruktur og er
# uafhængigt af app'ens egen push-kæde.
#
# Krav: repo-secret SUPABASE_DB_URL (samme som skema-eksporten bruger).
# Jobbene og deres forventede kadence står i docs/CRON.md — hold de to ens.

on:
  workflow_dispatch: {}
  schedule:
    # Hver halve time (G46). Kørte indtil august 2026 hver 6. time, hvilket ikke
    # passede til det, den overvåger: sync-live har en tavshedsgrænse på 30
    # minutter, så et dødt live-job kunne være usynligt næsten en hel kampdag —
    # netop de timer, hvor det betyder mest, og hvor brugerne står med forkerte
    # stillinger. En overvågning, der kigger sjældnere end den grænse, den
    # håndhæver, håndhæver den i praksis ikke.
    #
    # Prisen er 48 kørsler i døgnet à ~20 sekunder. Repoet er offentligt, så
    # GitHub Actions er gratis; bliver det privat igen, er dette tallet at kigge
    # på først. GitHub kører i øvrigt planlagte workflows med forsinkelse under
    # belastning, så kadencen er et loft for hyppigheden, ikke en garanti.
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: job-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Runneren har en psql-klient forudinstalleret. Modsat pg_dump er psql
      # ikke kræsen med serverversionen for almindelige forespørgsler, så her
      # er der ingen grund til at installere pg17-klienten som i skema-eksporten.
      # Rydningen af job_runs bor HER og ikke i et cron-job (G43).
      #
      # docs/CRON.md påstod, at tabellen blev ryddet med prune_job_runs(30),
      # men funktionen havde ingen kaldere — hverken et job eller kode. sync-live
      # alene skriver ~525.000 rækker om året, så tabellen voksede uden loft, og
      # Admin → Drift blev langsommere med tiden. Et register, der beskriver en
      # rydning, som ikke sker, er værre end ingen rydning: ingen leder efter
      # problemet.
      #
      # Denne workflow er stedet, fordi den allerede har databaseadgangen og
      # allerede kører på et skema — en rydning er ét ekstra udsagn frem for et
      # nyt endpoint, et nyt cron-job og en ny række i registeret. Den kører FØR
      # helbredstjekket, så et rødt tjek ikke afbryder den; 30 dages historik er
      # rigeligt til at aflæse et mønster, og rækker ældre end det kan hverken
      # gøre tjekket rødt eller grønt.
      - name: Ryd gamle job_runs
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Secret SUPABASE_DB_URL mangler. Tilføj den under Settings → Secrets and variables → Actions."
            exit 1
          fi
          slettet=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select public.prune_job_runs(30);")
          echo "Ryddede $slettet rækker ældre end 30 dage fra job_runs."

          # Fejltelemetrien ryddes samme sted og af samme grund (G42): en tabel
          # uden loft bliver langsom at læse længe før nogen opdager det. 90
          # dage og ikke 30 — en fejl, ingen har set på tre måneder, er enten
          # rettet eller ikke værd at gemme, men et crash fra sidste måned er
          # stadig en ledetråd.
          fejl=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select public.prune_client_errors(90);")
          echo "Ryddede $fejl fejlrapporter ældre end 90 dage."

      # ---- Migreringernes VIRKNING (B16) ----
      #
      # Fire filer i sql/README.md ruller tavst noget nyere tilbage, hvis de
      # gen-køres: #4 og #14 (runde-lås i stedet for kamp-lås), #9 (to policies
      # afløst af A8-invarianten) og #12 (stillings-views uden `scope`). Der
      # kommer ingen fejl — reglen bliver bare den gamle igen, og advarslen står
      # kun i en README, altså det sted, man læser HVIS man læser.
      #
      # Denne workflow er stedet af samme grund som rydningen ovenfor: den har
      # allerede databaseadgangen og kører allerede på et skema. Den spørger
      # ikke, om filerne er kørt — den spørger, om deres VIRKNING står i
      # databasen. Et tjek af "hvilke filer er kørt" ville kræve et register,
      # ingen vedligeholder; et tjek af virkningen kan aflæses direkte.
      #
      # Kører FØR helbredstjekket, så en rulle-tilbage ses, selv når et job er tavst.
      - name: Tjek migreringernes virkning i databasen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Secret SUPABASE_DB_URL mangler. Tilføj den under Settings → Secrets and variables → Actions."
            exit 1
          fi

          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -F'|' > virkning.txt <<'SQL'
          -- Hver række: navn | ok | hvad man gør, hvis den ikke er ok
          with tjek(navn, ok, rettelse) as (
            -- #20: stillings-viewene har scope-kolonnen (rullet tilbage af #12)
            select 'round_standings.scope',
                   exists (select 1 from information_schema.columns
                            where table_schema = 'public' and table_name = 'round_standings'
                              and column_name = 'scope'),
                   'Kør sql/tournament_scope.sql igen (#20 afløser #12)'
            union all
            select 'monthly_standings.scope',
                   exists (select 1 from information_schema.columns
                            where table_schema = 'public' and table_name = 'monthly_standings'
                              and column_name = 'scope'),
                   'Kør sql/tournament_scope.sql igen (#20 afløser #12)'
            union all
            -- #27: monthly_standings kører som kalderen og ikke som ejeren
            -- Værdien sammenlignes ORDRET og ikke med `like '%security_invoker%'`:
            -- `= true` og `= on` gemmes som hver sin streng, og en delstrengs-
            -- test på "on" ville melde MANGLER for en fuldt gyldig `= true`.
            -- Migreringen skriver `= on`, og det er dét, der tjekkes.
            select 'monthly_standings.security_invoker',
                   coalesce((select 'security_invoker=on' = any(reloptions)
                               from pg_class where relname = 'monthly_standings'
                                and relnamespace = 'public'::regnamespace), false),
                   'Kør sql/security_hardening.sql igen (#27)'
            union all
            -- #28: alle predictions-policies går gennem den fælles lås. Fem
            -- policies, og tallet er en del af kontrollen: forsvinder én, er
            -- låsen væk ét sted, hvilket er præcis det, #4/#14 gør ved en
            -- gen-kørsel.
            select 'de fem laas-policies kalder match_locked()',
                   (select count(*) from pg_policies
                     where schemaname = 'public'
                       and tablename in ('predictions', 'competition_participants')
                       and coalesce(qual, '') || coalesce(with_check, '') like '%match_locked%') = 5,
                   'Kør sql/matches_kickoff_tbd.sql igen (#28 afløser låseudtrykket i #25)'
            union all
            -- #13: A8-invarianten (auto-indmeldelse + strammet liga-exit)
            select 'group_membership_invariant-trigger',
                   exists (select 1 from pg_trigger
                            where tgrelid = 'public.competition_participants'::regclass
                              and not tgisinternal),
                   'Kør sql/group_membership_invariant.sql igen (#13 afløser to policies i #9)'
            union all
            -- #34: anon har ingen tabel-adgang, og kilden er lukket
            select 'anon uden tabel-grants',
                   (select count(*) from information_schema.role_table_grants
                     where grantee = 'anon' and table_schema = 'public') = 0,
                   'Kør sql/anon_grants.sql igen (#34) — en ny tabel kan have arvet grants'
            union all
            -- #43: samme for sekvenserne, som #34s formulering aldrig dækkede.
            -- ACL'en læses fra pg_class og ikke fra information_schema, som pr.
            -- standarden kun rapporterer USAGE på en sekvens — `grant all` giver
            -- også SELECT og UPDATE, og en kontrol, der kun ser den ene, ville
            -- melde ok for to tredjedele af det, den skal fange.
            select 'anon uden sekvens-grants',
                   not exists (
                     select 1 from pg_class c
                       join pg_namespace n on n.oid = c.relnamespace
                      where n.nspname = 'public' and c.relkind = 'S'
                        and coalesce(c.relacl::text, '') like '%anon=%'),
                   'Kør sql/anon_grants_finish.sql igen (#43)'
            union all
            -- #34 + #43: KILDEN og ikke kun tilstanden. De to kontroller ovenfor
            -- ser først en fejl, EFTER nogen har oprettet en tabel eller en
            -- sekvens; denne ser reglen, der ville give den grants, og fanger
            -- dermed en gen-indført default privilege samme dag.
            --
            -- Kun objekttype 'r' (tabeller og views) og 'S' (sekvenser).
            -- **'f' er bevidst udeladt:** `anon` SKAL kunne køre
            -- `username_available()` før login, og `anon_grants.sql` siger
            -- eksplicit, at den hverken rører funktions-grants eller `usage` på
            -- skemaet. En kontrol uden det filter ville være rød hver eneste
            -- gang for noget, der er rigtigt.
            --
            -- Kun grantor `postgres`: det er den rolle, vores egne migreringer
            -- opretter som. `supabase_admin` er udeladt, fordi den normalt ikke
            -- kan ændres fra SQL-editoren — og en kontrol, der altid er rød,
            -- lærer man at ignorere. Forbeholdet står i #43s hoved.
            select 'anon uden default privileges (postgres)',
                   not exists (
                     select 1
                       from pg_default_acl d
                       join pg_roles r on r.oid = d.defaclrole
                       join pg_namespace n on n.oid = d.defaclnamespace
                      where n.nspname = 'public' and r.rolname = 'postgres'
                        and d.defaclobjtype in ('r', 'S')
                        and coalesce(d.defaclacl::text, '') like '%anon=%'),
                   'Kør sql/anon_grants.sql (#34) og sql/anon_grants_finish.sql (#43) igen'
            union all
            -- #33: round_key() aflæser dansk tid og ikke sessionens
            select 'round_key() i dansk tid',
                   (select prosrc like '%Europe/Copenhagen%' from pg_proc
                     where proname = 'round_key' and pronamespace = 'public'::regnamespace),
                   'Kør sql/round_key_timezone.sql igen (#33)'
            union all
            -- #35: rettede tips flytter updated_at
            -- #36: fejltelemetrien har et sted at lande
            select 'client_errors-tabellen',
                   to_regclass('public.client_errors') is not null,
                   'Kør sql/client_errors.sql igen (#36)'
            union all
            select 'predictions_touch_updated_at',
                   exists (select 1 from pg_trigger
                            where tgrelid = 'public.predictions'::regclass
                              and tgname = 'predictions_touch_updated_at'),
                   'Kør sql/predictions_updated_at.sql igen (#35)'
          )
          select navn, case when ok then 'ok' else 'MANGLER' end, rettelse from tjek order by navn;
          SQL

          echo "Migrering | Tilstand"
          echo "----------------------"
          fail=0
          while IFS='|' read -r navn tilstand rettelse; do
            [ -z "$navn" ] && continue
            printf '%-44s %s\n' "$navn" "$tilstand"
            if [ "$tilstand" != "ok" ]; then
              echo "::error::$navn står ikke i databasen. $rettelse"
              fail=1
            fi
          done < virkning.txt

          if [ "$fail" -ne 0 ]; then
            echo "::error::En migrerings virkning mangler i produktionsdatabasen — se sql/README.md."
            exit 1
          fi
          echo "Alle kontroller står som forventet i databasen."

      - name: Tjek jobbenes helbred
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Secret SUPABASE_DB_URL mangler. Tilføj den under Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Tavshedsgrænserne er sat rundhåndet i forhold til kadencen i
          # docs/CRON.md, så et enkelt sprunget interval ikke larmer:
          #   sync-live          hvert minut        → alarm efter 30 min
          #   send-notifications hver 15.-30. minut → alarm efter 3 timer
          #   sync-matches       hver 12. time      → alarm efter 26 timer
          #
          # Kampprogram-jobbene UDLEDES af leagues-tabellen (G44) frem for at
          # stå skrevet her. Ét job pr. turnering, navngivet med liga-UUID'en af
          # api/_shared.js' syncMatchesJob(), så en ny turnering automatisk bliver
          # forventet — og en turnering, hvis job er dødt, ikke længere kan gemme
          # sig bag de seks andre. Turneringer uden api_league_id kan pr.
          # definition ikke synkronisere og forventes derfor ikke.
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -F'|' > rapport.txt <<'SQL'
          with forventet(job, navn, taalt_stilhed) as (
            select 'sync-live', 'sync-live', interval '30 minutes'
            union all
            select 'send-notifications', 'send-notifications', interval '3 hours'
            union all
            select 'sync-matches:' || l.id, 'sync-matches ' || l.name, interval '26 hours'
              from public.leagues l
             where l.api_league_id is not null
          ),
          seneste as (
            select f.job, f.navn,
                   (select max(r.started_at) from job_runs r where r.job = f.job) as sidst,
                   (select max(r.started_at) from job_runs r where r.job = f.job and r.ok) as sidst_ok,
                   f.taalt_stilhed
            from forventet f
          )
          select navn,
                 coalesce(to_char(sidst, 'YYYY-MM-DD HH24:MI'), 'aldrig'),
                 case
                   when sidst is null then 'INGEN KOERSLER'
                   when now() - sidst > taalt_stilhed then 'TAVS'
                   else 'ok'
                 end,
                 (select count(*) from job_runs f2
                   where f2.job = seneste.job
                     and f2.ok is distinct from true
                     and (sidst_ok is null or f2.started_at > sidst_ok))
          from seneste
          order by navn;
          SQL

          echo "Job | Sidste kørsel | Tilstand | Fejl i træk"
          echo "--------------------------------------------"
          fail=0
          while IFS='|' read -r job sidst tilstand fejlserie; do
            [ -z "$job" ] && continue
            printf '%-34s %-18s %-15s %s\n' "$job" "$sidst" "$tilstand" "$fejlserie"

            if [ "$tilstand" = "TAVS" ]; then
              echo "::error::$job har ikke meldt sig siden $sidst. Tjek om cron-job.org har deaktiveret jobbet (se docs/CRON.md)."
              fail=1
            elif [ "$tilstand" = "INGEN KOERSLER" ]; then
              # Ikke en fejl i sig selv: sådan ser det ud, indtil sql/job_runs.sql
              # er kørt i produktion og jobbene har nået at melde sig første gang.
              echo "::warning::$job har aldrig meldt sig. Er sql/job_runs.sql kørt, og er jobbet oprettet?"
            fi

            if [ "${fejlserie:-0}" -ge 3 ]; then
              echo "::error::$job er fejlet $fejlserie gange i træk. Se job_runs.error i Admin → Drift."
              fail=1
            fi
          done < rapport.txt

          if [ "$fail" -ne 0 ]; then
            echo "::error::Mindst ét planlagt job kræver opmærksomhed."
            exit 1
          fi
          echo "Alle jobs melder sig som forventet."

      # ---- Har kampene et klokkeslæt? (G84) ----
      #
      # Den tredje slags fejl, workflowen dækker. De to ovenfor spørger, om
      # noget KØRTE (job_runs) og om en migrerings virkning STÅR der
      # (information_schema). Denne spørger, om det, der kørte, skrev noget
      # troværdigt — altså om DATAENE er plausible.
      #
      # Baggrunden står i sql/checks/kickoff_coverage.sql: fra 2. til 6. august
      # 2026 stod alle kampe fra de fem football-data-turneringer uden
      # klokkeslæt, fordi flaget blev sat af leverandørens `status`. Fire døgn,
      # hver eneste bruger i de turneringer, og fundet af et menneske, der
      # undrede sig over en sortering. Hverken enhedstestene eller de to
      # kontroller ovenfor kunne se det: syncen kørte, den meldte grønt, og
      # skemaet var uændret.
      #
      # STEDET ER VALGT AF SAMME GRUND SOM RYDNINGEN OG MIGRERINGSTJEKKET: her
      # er databaseadgangen allerede, og en kontrol mere er ét psql-kald frem
      # for et nyt endpoint og en ny række i registeret.
      #
      # Trinnet ligger SIDST med vilje. Et fejlende trin springer resten af
      # jobbet over, så en kontrol, der lægges foran de to andre, kan skjule et
      # tavst job — og et tavst job er den dyrere af de to fejl.
      #
      # Forespørgslen bor i en fil og ikke i en heredoc som de to andre, netop
      # fordi den kan tage fejl: en temporær view kan læses af BÅDE dette trin
      # og af sql/tests/kickoff_coverage.sql i CI, så reglen kun findes ét sted.
      # Testen efterprøver begge retninger og er selv efterprøvet ved at mutere
      # kontrollen otte gange.
      - name: Tjek at kampene har klokkeslæt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Secret SUPABASE_DB_URL mangler. Tilføj den under Settings → Secrets and variables → Actions."
            exit 1
          fi

          # `-q`, så `CREATE VIEW` ikke havner i rapporten. `-f` og `-c` deler
          # session, så den temporære view findes, når der læses fra den — og
          # forsvinder, når psql lukker. Der installeres intet i produktionen.
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -At -F'|' \
            -f sql/checks/kickoff_coverage.sql \
            -c "select liga, provider, kommende, uden_tid, tilstand
                  from kickoff_coverage
                 order by (tilstand = 'ALLE UDEN TID') desc, liga" > kickoff.txt

          echo "Turnering | Leverandør | Kampe (10 dage) | Uden tid | Tilstand"
          echo "-----------------------------------------------------------"
          fail=0
          while IFS='|' read -r liga provider kommende uden tilstand; do
            [ -z "$liga" ] && continue
            printf '%-24s %-14s %-17s %-10s %s\n' "$liga" "$provider" "$kommende" "$uden" "$tilstand"
            if [ "$tilstand" = "ALLE UDEN TID" ]; then
              echo "::error::$liga: alle $kommende kampe inden for ti dage står uden klokkeslæt. Kør 'Hent nu' i Admin → Kampe og se på ${provider}-aflæsningen i api/_providers/kickoff.js."
              fail=1
            fi
          done < kickoff.txt

          # Ingen rækker overhovedet er ikke en fejl: sådan ser en landsholdspause
          # ud. Det er en oplysning, ikke en alarm — der er intet at aflæse.
          if [ ! -s kickoff.txt ]; then
            echo "Ingen kampe inden for de næste ti dage."
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::Mindst én turnering har mistet sine klokkeslæt — se sql/checks/kickoff_coverage.sql."
            exit 1
          fi
          echo "Klokkeslættene ser troværdige ud."
