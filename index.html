<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lader appen tegne helt ud i skærmens hjørner på
         iPhones med hak og home-indikator. Den hører UADSKILLELIGT sammen med
         env(safe-area-inset-*) i MainApp.jsx: uden dem gør cover det værre, ikke
         bedre — indholdet lægger sig da under status-baren og bundnavigationen
         under home-indikatoren. `black-translucent` nedenfor er netop det, der
         gør den øverste inset nødvendig. Rettes derfor kun sammen (G29). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Prediction Champ</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0C1622" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Prediction Champ" />
  </head>
  <body style="margin:0; background:#060B12;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
