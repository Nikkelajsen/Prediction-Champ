<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lader appen tegne helt ud i skærmens hjørner på
         iPhones med hak og home-indikator. Den hører UADSKILLELIGT sammen med
         env(safe-area-inset-*) i MainApp.jsx: uden dem gør cover det værre, ikke
         bedre — indholdet lægger sig da under status-baren og bundnavigationen
         under home-indikatoren. `black-translucent` nedenfor er netop det, der
         gør den øverste inset nødvendig. Rettes derfor kun sammen (G29). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Leagly</title>
    <!-- Forvarmning af de to skrifter, første maling faktisk bruger: brødteksten
         og wordmarket. @font-face-blokkene selv står i src/ui/theme.js, fordi
         designtokens kun må findes ét sted — men de findes først, når React har
         renderet, altså efter en 370 kB bundle. Uden disse to linjer ville
         skriften stadig skifte sent, selv om filerne nu er vores egne.

         `crossorigin` er PÅKRÆVET, også for vores eget domæne: fonte hentes i
         CORS-tilstand, og uden attributten henter browseren filen to gange.

         Filnavnene er de samme som i theme.js og er cachet `immutable` i
         vercel.json — skiftes en fontfil ud, skal navnet skifte begge steder. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/barlow-400-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/barlow-condensed-700-latin.woff2" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/leagly-icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0C1622" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Leagly" />
  </head>
  <body style="margin:0; background:#060B12;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
